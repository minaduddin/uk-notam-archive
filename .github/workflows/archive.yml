name: Archive UK PIB

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button for a manual run

permissions:
  contents: write             # needed to commit data/PIB.xml

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download PIB
        id: pib
        run: python fetch_pib.py
        continue-on-error: true   # a NATS outage is a warning, not a failed run (no email every 30 min)
      - name: Commit if the NOTAMs changed
        if: steps.pib.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/PIB.xml
          git commit -m "PIB $(date -u +%Y-%m-%dT%H:%MZ) · ${{ steps.pib.outputs.notams }} NOTAMs"
          git push
