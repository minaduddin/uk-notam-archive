name: Archive UK PIB

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button: archive now and rebuild the website
  push:
    branches: [main]
    paths: ["build_site.py"]  # rebuild the website when its code changes

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # commit data/notams/ and upload daily snapshots to Releases
    outputs:
      deploy: ${{ steps.rec.outputs.records_changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download PIB
        id: pib
        if: github.event_name != 'push'
        run: python fetch_pib.py
        continue-on-error: true   # a NATS outage is a warning, not a failed run (no email every 30 min)
      - name: Update NOTAM records
        id: rec
        run: python build_site.py --records
      - name: Daily raw snapshot to Releases
        # One gzipped copy of the bulletin per day, kept as a Release file (not in the repo, so the repo stays small).
        # Monthly release "snapshots-YYYY-MM", file "PIB-YYYY-MM-DD.xml.gz" (first good download of the day, UTC).
        if: github.event_name != 'push' && hashFiles('data/PIB.xml') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m); day=$(date -u +%Y-%m-%d)
          tag="snapshots-$month"; file="PIB-$day.xml.gz"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Raw PIB snapshots $month" \
              --notes "One gzipped copy of the NATS PIB per day (UTC), exactly as downloaded. Unofficial copy: do not use for flight planning." \
              --latest=false || gh release view "$tag" >/dev/null
          fi
          if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$file"; then
            echo "$file already saved"; exit 0
          fi
          gzip -9 -c data/PIB.xml > "$RUNNER_TEMP/$file"
          gh release upload "$tag" "$RUNNER_TEMP/$file"
          echo "saved $file to $tag"
      - name: Commit if anything changed
        run: |
          git add data/notams/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PIB $(date -u +%Y-%m-%dT%H:%MZ) · ${{ steps.pib.outputs.notams || 'records' }} NOTAMs"
          git push

  website:
    needs: archive
    if: needs.archive.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # includes the records just committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build website
        run: python build_site.py --build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
