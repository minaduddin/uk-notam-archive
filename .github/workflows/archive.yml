name: Archive UK PIB

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button: archive now and rebuild the website
  push:
    branches: [main]
    paths: ["build_site.py"]  # rebuild the website when its code changes

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # commit data/PIB.xml and data/notams/
    outputs:
      deploy: ${{ steps.rec.outputs.records_changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download PIB
        id: pib
        if: github.event_name != 'push'
        run: python fetch_pib.py
        continue-on-error: true   # a NATS outage is a warning, not a failed run (no email every 30 min)
      - name: Update NOTAM records
        id: rec
        run: python build_site.py --records
      - name: Commit if anything changed
        run: |
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PIB $(date -u +%Y-%m-%dT%H:%MZ) · ${{ steps.pib.outputs.notams || 'records' }} NOTAMs"
          git push

  website:
    needs: archive
    if: needs.archive.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # includes the records just committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build website
        run: python build_site.py --build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
